@font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --mint: #3ddc84; --bg: #000; --fg: #fff; --muted: #9b9b9b; --line: #262626; --panel: #141414; --row: #1c1c1c; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html, body { overflow-x: hidden; overscroll-behavior-y: none; height: 100%; }
body { margin: 0; min-height: 100svh; background: var(--bg); color: var(--fg); font: 400 17px/1.4 "Archivo", "Helvetica Neue", Arial, sans-serif; }
a { color: inherit; }

/* One screen, no scroll: the list of rows takes whatever height is left. */
.page { width: 100%; max-width: 480px; height: 100svh; height: 100dvh; min-height: 520px; margin-inline: auto;
  padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: clamp(10px, 1.8dvh, 20px); }
.bar { display: flex; align-items: center; justify-content: space-between; }

.lang button { appearance: none; background: none; border: 0; color: var(--muted); font: 600 14px/1 "Archivo", sans-serif; min-width: 40px; min-height: 40px; border-radius: 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { color: var(--fg); background: var(--row); }
.round { appearance: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--row); color: var(--fg); cursor: pointer; }
.round svg { width: 20px; height: 20px; fill: currentColor; }

/* The name is the one big thing on the page: wide, heavy, edge to edge. */
.head { margin: 0; }
h1 { margin: 0; font-size: min(calc((min(100vw, 480px) - 34px) / 7.3), 10.5dvh); line-height: .82; font-weight: 900; font-stretch: 125%; letter-spacing: -.035em; text-transform: uppercase; display: flex; align-items: baseline; }
h1 i { flex: none; width: .17em; height: .17em; margin-left: .05em; border-radius: 50%; background: var(--mint); }

.status .dot { width: 9px; height: 9px; border-radius: 50%; background: #5a5a5a; }
.status.on { color: var(--mint); }
.status.on .dot { background: var(--mint); }

/* Main action */
.wa { display: flex; align-items: center; gap: 14px; min-height: clamp(62px, 10dvh, 92px); padding: 0 18px; border-radius: 18px; background: var(--mint); color: #000; text-decoration: none; transition: transform .12s; }

/* The other ways in, as one list */

.row:active { background: var(--row); }
.row .ic { flex: none; width: clamp(36px, 5.6dvh, 48px); height: clamp(36px, 5.6dvh, 48px); border-radius: 12px; background: var(--row); display: grid; place-items: center; }
.row .ic svg { width: 22px; height: 22px; fill: currentColor; }
.row .ic img { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; display: block; }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.row b { font-size: clamp(16px, 2.4dvh, 19px); font-weight: 650; }
.row small { margin-top: 2px; font-size: clamp(13px, 1.8dvh, 15px); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.live-dot { width: 10px; height: 10px; border-radius: 50%; background: #5a5a5a; }

/* The app on the phone */

.app { appearance: none; display: flex; align-items: center; gap: 10px; min-height: clamp(54px, 8dvh, 72px); padding: 0 14px; border-radius: 16px; border: 1px solid #333; background: none; color: var(--fg); text-decoration: none; text-align: left; font: inherit; cursor: pointer; transition: transform .12s; }

.app svg { flex: none; width: 26px; height: 26px; fill: currentColor; }
.app span { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.app small { font-size: 12px; color: var(--muted); }
.app b { font-size: clamp(15px, 2.3dvh, 18px); font-weight: 700; white-space: nowrap; }
.app.mine { border-color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; z-index: 40; }

/* Opening: only the name moves. Letters rise one after the other, then the dot. */
h1 .w { display: inline-flex; overflow: hidden; padding-bottom: .03em; }
h1 .w b { display: inline-block; font-weight: inherit; transform: translateY(105%); animation: rise .65s cubic-bezier(.16, .84, .3, 1) forwards; animation-delay: calc(.05s + var(--i) * 45ms); }
h1 i { transform: scale(0); animation: pop .45s cubic-bezier(.34, 1.56, .64, 1) .5s forwards; }
@keyframes rise { to { transform: none; } }
h1.done .w b, h1.done i { animation: none; transform: none; }
@keyframes pop { to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { h1 .w b, h1 i { animation: none; transform: none; } .wa, .app { transition: none; } }

/* iPhone: how to put Transfer on the home screen (full screen, fits without scrolling) */
.ios { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; max-width: 480px; margin-inline: auto;
  padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom)); gap: clamp(8px, 1.6dvh, 16px); }

.ios li span { font-size: clamp(15px, 2.2dvh, 18px); line-height: 1.3; }
.pic { justify-self: end; display: grid; place-items: center; }
.tile { width: clamp(46px, 7.5dvh, 64px); height: clamp(46px, 7.5dvh, 64px); border-radius: 16px; background: #f2f2f7; display: grid; place-items: center; box-shadow: 0 0 0 3px #0a84ff; animation: hint 1.6s ease-in-out infinite; }

.menu { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #f2f2f7; color: #000; font-size: 14px; font-weight: 600; box-shadow: 0 0 0 3px #0a84ff; max-width: 150px; line-height: 1.2; animation: hint 1.6s ease-in-out infinite; }
.menu svg { flex: none; width: 22px; height: 22px; }

.msg.guest { align-self: flex-end; background: var(--mint); color: #000; border-bottom-right-radius: 6px; }

.typing { align-self: flex-start; display: flex; gap: 5px; padding: 14px 16px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
.compose { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.compose textarea { flex: 1; min-height: 46px; max-height: 120px; resize: none; border-radius: 23px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 12px 16px; font: 400 16px/1.35 "Archivo", sans-serif; }

.compose button svg { width: 22px; height: 22px; fill: currentColor; }

    if (rec) try { rec.stop(); } catch (e) {}
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (location.hash === "#tobias") history.replaceState(null, "", location.pathname);
  }
  function send(text, voice) {
    text = (text || "").trim(); if (!text) return;
    if (!chatId) { chatId = newId(); try { localStorage.setItem("t-chat", chatId); } catch (e) {} }
    spoke = !!voice;
    var b = bubble("guest", text); say.value = ""; sendBtn.disabled = true; grow();
    rpc("web_chat_send", { p_chat: chatId, p_body: text.slice(0, 800), p_lang: lang, p_voice: !!voice }).then(function (r) {
      shownIds[r.id] = 1; waitingSince = Date.now(); lateShown = false; typing(true); schedule();
    }, function (e) {
      b.style.opacity = ".55"; note(e.code === "KB429" ? "tobMany" : "tobErr");
    });
  }
  function grow() { say.style.height = "auto"; say.style.height = Math.min(say.scrollHeight, 120) + "px"; sendBtn.disabled = !say.value.trim(); }
  say.addEventListener("input", grow);
  say.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(say.value, false); } });
  document.getElementById("compose").addEventListener("submit", function (e) { e.preventDefault(); send(say.value, false); });
  document.getElementById("open-chat").addEventListener("click", function () { history.replaceState(null, "", "#tobias"); openChat(); });
  document.getElementById("close-chat").addEventListener("click", closeChat);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !chat.hidden) closeChat(); });

  // Talking: the phone turns speech into text; when the customer talked, Tobias's answer is read aloud.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
  if (SR) {
    micBtn.hidden = false;
    micBtn.addEventListener("click", function () {
      if (rec) { rec.stop(); return; }
      if (window.speechSynthesis) speechSynthesis.cancel();
      rec = new SR(); rec.lang = lang === "en" ? "en-GB" : "de-DE"; rec.interimResults = true; rec.continuous = false;
      var heard = "";
      rec.onresult = function (ev) {
        heard = ""; for (var i = 0; i < ev.results.length; i++) heard += ev.results[i][0].transcript;
        say.value = heard; grow();
      };
      rec.onerror = function (ev) { if (ev.error === "not-allowed" || ev.error === "service-not-allowed") note("tobNoMic"); };
      rec.onend = function () { rec = null; micBtn.setAttribute("aria-pressed", "false"); if (heard.trim()) send(heard, true); };
      micBtn.setAttribute("aria-pressed", "true");
      try { rec.start(); } catch (e) { rec = null; micBtn.setAttribute("aria-pressed", "false"); }
    });
  }
  if (location.hash === "#tobias") setTimeout(openChat, 0);
  if (location.hash === "#live") setTimeout(function () { document.getElementById("open-map").click(); }, 0);

  // New texts for this layout (status line, app buttons, iPhone guide).
  Object.assign(T.de, {
    web: "Fahrt bestellen", webSub: "Auf der Website, mit Preis vorab", tob: "Mit Tobias chatten", tobSub: "Schreiben oder sprechen, gleich hier",
    map: "Freie Fahrzeuge live", mapSub: "Auf der Karte, wer in der Nähe ist", save: "Kontakt speichern", saveSub: "Nummer und WhatsApp ins Telefon",
    stNow: "Jetzt frei in Stuttgart: {n}", car1: "Fahrzeug", carN: "Fahrzeuge", stNone: "Gerade alle unterwegs, wir planen Ihre Fahrt", stWait: "Fahrzeuge werden gesucht …",
    apA: "Android", apAB: "APK laden", apI: "iPhone", apIB: "Einrichten",
    igT: "Transfer aufs iPhone", igP: "Im App Store gibt es Transfer noch nicht. So kommt es auf Ihren Home-Bildschirm und öffnet sich wie eine App.",
    ig1s: "Unten in Safari auf Teilen tippen. Nicht zu sehen? Erst auf ⋯ tippen.", ig1c: "Oben rechts in Chrome, neben der Adresse, auf Teilen tippen.",
    ig2: "Nach unten wischen und dies wählen:", igAdd: "Zum Home-Bildschirm", ig3: "Oben rechts auf „Hinzufügen“ tippen.", igAddBtn: "Hinzufügen",
    ig4: "Fertig. Transfer liegt jetzt auf Ihrem Home-Bildschirm.", igOk: "Verstanden",
    igIn: "Das geht nur in Safari. Bitte kopieren Sie den Link und öffnen Sie ihn dort.", igCopy: "Link kopieren", igCopied: "Kopiert, jetzt in Safari einfügen"
  });
  Object.assign(T.en, {
    web: "Book a ride", webSub: "On the website, price up front", tob: "Chat with Tobias", tobSub: "Type or talk, right here",
    map: "Free cars live", mapSub: "See on the map who is nearby", save: "Save contact", saveSub: "Number and WhatsApp on your phone",
    stNow: "Free now in Stuttgart: {n}", car1: "car", carN: "cars", stNone: "All cars on a ride, we will plan yours", stWait: "Looking for cars …",
    apA: "Android", apAB: "Get the APK", apI: "iPhone", apIB: "Set it up",
    igT: "Transfer on your iPhone", igP: "Transfer is not in the App Store yet. This puts it on your home screen, and it opens like an app.",
    ig1s: "Tap Share at the bottom of Safari. Can’t see it? Tap ⋯ first.", ig1c: "Tap Share at the top right of Chrome, next to the address.",
    ig2: "Scroll down and choose this:", igAdd: "Add to Home Screen", ig3: "Tap “Add” at the top right.", igAddBtn: "Add",
    ig4: "Done. Transfer is now on your home screen.", igOk: "Got it",
    igIn: "This only works in Safari. Please copy the link and open it there.", igCopy: "Copy link", igCopied: "Copied, now paste it in Safari"
  });

  // Live status line under the name (the same count as the map).
  var stEl = document.getElementById("status"), stTx = document.getElementById("status-text"), stFree = null;
  function status() {
    if (stFree === null) { stTx.textContent = t("stWait"); return; }
    stEl.classList.toggle("on", stFree > 0);
    stTx.textContent = stFree ? fill(t("stNow"), { n: stFree + " " + (stFree === 1 ? t("car1") : t("carN")) }) : t("stNone");
  }
  fetchCars().then(function (d) { stFree = d.free || 0; status(); }, function () { stEl.hidden = true; });

  // App buttons. Android: the customer APK (../app/version.json). iPhone: no app outside the App Store, so the
  // site goes on the home screen; the manifest's start_url makes that icon open the booking website.
  var ua = navigator.userAgent, isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (standalone) document.getElementById("apps").hidden = true;
  var mine = isIOS ? "app-ios" : /Android/.test(ua) ? "app-android" : null;
  if (mine) document.getElementById(mine).classList.add("mine");
  fetch("../app/version.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
    if (v && v.apk) { var a = document.getElementById("app-android"); a.href = "../app/" + v.apk; a.setAttribute("download", v.apk); }
  }, function () {});

  var ios = document.getElementById("ios"), inApp = /FBAN|FBAV|Instagram|Line\/|GSA\/|Snapchat|TikTok|WhatsApp/.test(ua);
  function iosText() { document.getElementById("ig-1").textContent = t(/CriOS/.test(ua) ? "ig1c" : "ig1s"); }
  function openIos() {
    iosText(); document.getElementById("ios-inapp").hidden = !inApp;
    ios.hidden = false; document.body.style.overflow = "hidden"; document.getElementById("ios-ok").focus({ preventScroll: true });
    if (location.hash !== "#iphone") history.replaceState(null, "", "#iphone");
  }
  function closeIos() { ios.hidden = true; document.body.style.overflow = ""; if (location.hash === "#iphone") history.replaceState(null, "", location.pathname); document.getElementById("app-ios").focus({ preventScroll: true }); }
  document.getElementById("app-ios").addEventListener("click", openIos);
  document.getElementById("ios-ok").addEventListener("click", closeIos);
  document.getElementById("ios-x").addEventListener("click", closeIos);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !ios.hidden) closeIos(); });
  document.getElementById("ios-copy").addEventListener("click", function () {
    var b = this, url = "https://transfer-ride.github.io/link/#iphone";
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { b.textContent = t("igCopied"); }, function () { prompt("", url); });
  });
  if (location.hash === "#iphone") setTimeout(openIos, 0);

  // After the opening, drop the animation so the name is painted plainly.
  var h1 = document.querySelector("h1"); setTimeout(function () { h1.classList.add("done"); }, 1200);

  var applyBase = applyLang;
  applyLang = function () { applyBase(); status(); iosText(); };
  applyLang();
})();
</script>
</body>
</html>
