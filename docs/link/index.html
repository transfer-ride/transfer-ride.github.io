    document.querySelectorAll("[data-t]").forEach(function (n) { n.textContent = t(n.getAttribute("data-t")); });
    document.querySelectorAll("[data-tp]").forEach(function (n) { n.placeholder = t(n.getAttribute("data-tp")); n.setAttribute("aria-label", n.placeholder); });
    document.querySelectorAll("[data-ta]").forEach(function (n) { n.setAttribute("aria-label", t(n.getAttribute("data-ta"))); });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
    if (last) show(last);
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); try { localStorage.setItem("t-lang", lang); } catch (e) {} applyLang(); });
  });

  var center = { lat: 48.7784, lon: 9.18, name: "Stuttgart" };
  var map = null, markers = [], youMarker = null, timer = null, last = null;
  var sheet = document.getElementById("sheet");

  function fetchCars() {
    return fetch(API, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY },
      body: JSON.stringify({ p_lat: center.lat, p_lon: center.lon, p_km: RADIUS }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function show(data) {
    last = data;
    var free = data.free || 0, busy = data.busy || 0;
    document.getElementById("n").textContent = String(free);
    document.getElementById("n-text").textContent = free ? (free === 1 ? t("free1") : t("freeN")) : t("none");
    var sub = free ? fill(t("around"), { k: RADIUS, p: center.name }) : t("noneSub");
    if (busy) sub += " · " + fill(t("busy"), { n: busy });
    document.getElementById("n-sub").textContent = sub;
    if (!map) return;
    markers.forEach(function (m) { m.remove(); });
    markers = (data.cars || []).map(function (c) {
      var el = document.createElement("div");
      el.className = "car" + (c.free ? "" : " busy");
      el.innerHTML = '<svg aria-hidden="true"><use href="#i-car"/></svg>';
      return new maplibregl.Marker({ element: el }).setLngLat([c.lon, c.lat]).addTo(map);
    });
  }

  function refresh() {
    fetchCars().then(show, function () {
      document.getElementById("n").textContent = "–";
      document.getElementById("n-text").textContent = t("err");
      document.getElementById("n-sub").textContent = "";
    });
  }

  // A quick count on the button before the map is opened.
  fetchCars().then(function (d) {
    if (d.free) document.querySelector(".live-dot").classList.add("on");
    if (d.free) document.getElementById("map-sub").textContent = fill(t("near"), { n: d.free + " " + (d.free === 1 ? t("free1") : t("freeN")) });
  }, function () {});

  function loadMap(done) {
    if (window.maplibregl) return done();
    var s = document.createElement("script");
    s.src = "../assets/vendor/maplibre-gl.js";
    s.onload = done;
    document.head.appendChild(s);
  }

  function moveTo(lat, lon, name) {
    center = { lat: lat, lon: lon, name: name };
    if (map) map.flyTo({ center: [lon, lat], zoom: 11 });
    refresh();
  }

  document.getElementById("open-map").addEventListener("click", function () {
    sheet.hidden = false;
    document.body.style.overflow = "hidden";
    loadMap(function () {
      if (!map) {
        map = new maplibregl.Map({ container: "map", style: STYLE, center: [center.lon, center.lat], zoom: 10.5, attributionControl: { compact: true } });
        map.on("load", refresh);
      } else { refresh(); }
    });
    clearInterval(timer);
    timer = setInterval(refresh, 15000);
    document.getElementById("place").focus({ preventScroll: true });
  });

  function closeMap() {
    sheet.hidden = true;
    document.body.style.overflow = "";
    clearInterval(timer);
    document.getElementById("open-map").focus();
  }
  document.getElementById("close-map").addEventListener("click", closeMap);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) closeMap(); });

  document.getElementById("me").addEventListener("click", function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (p) {
      var lat = p.coords.latitude, lon = p.coords.longitude;
      if (map) {
        if (!youMarker) { var el = document.createElement("div"); el.className = "you"; youMarker = new maplibregl.Marker({ element: el }); }
        youMarker.setLngLat([lon, lat]).addTo(map);
      }
      moveTo(lat, lon, t("here"));
    }, function () {}, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
  });

  // Search a city or address (Photon, free, no key).
  var input = document.getElementById("place"), hits = document.getElementById("hits"), wait = null;
  input.addEventListener("input", function () {
    clearTimeout(wait);
    var q = input.value.trim();
    if (q.length < 3) { hits.hidden = true; return; }
    wait = setTimeout(function () {
      fetch("https://photon.komoot.io/api/?limit=5&lat=48.78&lon=9.18&lang=" + (lang === "el" ? "default" : lang) + "&q=" + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          hits.innerHTML = "";
          (j.features || []).forEach(function (f) {
            var p = f.properties, name = [p.name, p.city && p.city !== p.name ? p.city : null, p.country].filter(Boolean).join(", ");
            var li = document.createElement("li"), b = document.createElement("button");
            b.type = "button"; b.textContent = name;
            b.addEventListener("click", function () {
              input.value = p.name || name; hits.hidden = true; input.blur();
              moveTo(f.geometry.coordinates[1], f.geometry.coordinates[0], p.name || name);
            });
            li.appendChild(b); hits.appendChild(li);
          });
          hits.hidden = !hits.children.length;
        }, function () { hits.hidden = true; });
    }, 300);
  });

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200);
  }
  function share(url, name) {
    if (navigator.share) { navigator.share({ title: t("title"), text: name, url: url }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast(t("copied")); }, function () { prompt("", url); });
  }
  document.getElementById("share-page").addEventListener("click", function () { share("https://transfer-ride.github.io/link/", t("tag")); });
  document.querySelectorAll("[data-share]").forEach(function (b) {
    b.addEventListener("click", function () { share(b.getAttribute("data-share"), t(b.getAttribute("data-name"))); });
  });
  if (location.hash === "#live") setTimeout(function () { document.getElementById("open-map").click(); }, 0);

  applyLang();
})();
</script>
</body>
</html>
