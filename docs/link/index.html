/* Opening: the logo settles, the letters rise one by one, the dot drops in, then the buttons. */

/* More motion: drifting glow, moving road lines, a turning ring round the logo, a shine on the main button,
   a light that follows the finger on every button. All of it stops for reduced motion. */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg::before { content: ""; position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: -30vmax; margin-left: -70vmax;
  background: radial-gradient(closest-side, rgba(61, 220, 132, .16), rgba(61, 220, 132, .05) 45%, transparent 70%);
  animation: drift 14s ease-in-out infinite alternate; }

  background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .07) 0 34px, transparent 34px 86px);
  transform: perspective(300px) rotateX(58deg); transform-origin: 50% 100%; animation: road 1.6s linear infinite; opacity: .9; }
@keyframes drift { from { transform: translate(-6%, 0) scale(1); } to { transform: translate(6%, 8%) scale(1.12); } }

.ring { position: relative; display: grid; place-items: center; }
.ring::before { content: ""; position: absolute; inset: -7px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 62%, var(--mint) 82%, transparent 100%);
  -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
          mask: radial-gradient(closest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
  animation: spin 3.2s linear infinite, fadein .8s 1s both; }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes fadein { from { opacity: 0; } }
.pill { overflow: hidden; isolation: isolate; }

  background: radial-gradient(160px circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, .09), transparent 70%); }
.pill:hover::before, .pill.lit::before { opacity: 1; }

.pill-main::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; z-index: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); transform: skewX(-18deg);
  animation: shine 4.5s 2s ease-in-out infinite; }

/* The live map sheet */

    loadMap(function () {

        map = new maplibregl.Map({ container: "map", style: STYLE, center: [center.lon, center.lat], zoom: 10.5, attributionControl: { compact: true } });
        map.on("load", refresh);
      } else { refresh(); }
    });
    clearInterval(timer);
    timer = setInterval(refresh, 15000);
    document.getElementById("place").focus({ preventScroll: true });
  });

  function closeMap() {
    sheet.hidden = true;
    document.body.style.overflow = "";
    clearInterval(timer);
    document.getElementById("open-map").focus();
  }
  document.getElementById("close-map").addEventListener("click", closeMap);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) closeMap(); });

  document.getElementById("me").addEventListener("click", function () {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (p) {
      var lat = p.coords.latitude, lon = p.coords.longitude;
      if (map) {
        if (!youMarker) { var el = document.createElement("div"); el.className = "you"; youMarker = new maplibregl.Marker({ element: el }); }
        youMarker.setLngLat([lon, lat]).addTo(map);
      }
      moveTo(lat, lon, t("here"));
    }, function () {}, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
  });

  // Search a city or address (Photon, free, no key).
  var input = document.getElementById("place"), hits = document.getElementById("hits"), wait = null;
  input.addEventListener("input", function () {
    clearTimeout(wait);
    var q = input.value.trim();
    if (q.length < 3) { hits.hidden = true; return; }
    wait = setTimeout(function () {
      fetch("https://photon.komoot.io/api/?limit=5&lat=48.78&lon=9.18&lang=" + (lang === "el" ? "default" : lang) + "&q=" + encodeURIComponent(q))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          hits.innerHTML = "";
          (j.features || []).forEach(function (f) {
            var p = f.properties, name = [p.name, p.city && p.city !== p.name ? p.city : null, p.country].filter(Boolean).join(", ");
            var li = document.createElement("li"), b = document.createElement("button");
            b.type = "button"; b.textContent = name;
            b.addEventListener("click", function () {
              input.value = p.name || name; hits.hidden = true; input.blur();
              moveTo(f.geometry.coordinates[1], f.geometry.coordinates[0], p.name || name);
            });
            li.appendChild(b); hits.appendChild(li);
          });
          hits.hidden = !hits.children.length;
        }, function () { hits.hidden = true; });
    }, 300);
  });

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200);
  }
  function share(url, name) {
    if (navigator.share) { navigator.share({ title: t("title"), text: name, url: url }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast(t("copied")); }, function () { prompt("", url); });
  }
  document.getElementById("share-page").addEventListener("click", function () { share("https://transfer-ride.github.io/link/", t("tag")); });
  document.querySelectorAll("[data-share]").forEach(function (b) {
    b.addEventListener("click", function () { share(b.getAttribute("data-share"), t(b.getAttribute("data-name"))); });
  });
  /* ---- Chat with Tobias ---- */
  var RPC = "https://qdrwssvwlpbloqnnyrzk.supabase.co/rest/v1/rpc/";
  var WA = "https://wa.me/4915777104912?text=Hallo%20Transfer";
  var chat = document.getElementById("chat"), msgs = document.getElementById("msgs"), say = document.getElementById("say");
  var sendBtn = document.getElementById("send"), micBtn = document.getElementById("mic");
  var chatId = null, lastId = 0, waitingSince = 0, pollTimer = null, typingEl = null, spoke = false, lateShown = false, shownIds = {};
  try { chatId = localStorage.getItem("t-chat"); lastId = 0; } catch (e) {}
  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }
  function rpc(fn, body) {
    return fetch(RPC + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j && j.message); e.code = j && j.code; throw e; } return j; }); });
  }
  function bubble(role, text, html) {
    var d = document.createElement("div"); d.className = "msg " + role;
    if (html) d.innerHTML = html; else d.textContent = text;
    if (typingEl && typingEl.parentNode) msgs.insertBefore(d, typingEl); else msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function note(key) { bubble("note", "", t(key).replace("WhatsApp", '<a href="' + WA + '" rel="noopener">WhatsApp</a>')); }
  function typing(on) {
    if (on && !typingEl) { typingEl = document.createElement("div"); typingEl.className = "typing"; typingEl.innerHTML = "<i></i><i></i><i></i>"; msgs.appendChild(typingEl); msgs.scrollTop = msgs.scrollHeight; }
    if (!on && typingEl) { typingEl.remove(); typingEl = null; }
  }
  function speak(text) {
    if (!spoke || !window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text); u.lang = lang === "en" ? "en-GB" : "de-DE"; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  function poll() {
    if (!chatId) return;
    rpc("web_chat_poll", { p_chat: chatId, p_after: lastId }).then(function (list) {
      list.forEach(function (m) {
        lastId = Math.max(lastId, m.id);
        if (shownIds[m.id]) return; shownIds[m.id] = 1;
        if (m.role === "tobias") { typing(false); waitingSince = 0; lateShown = false; bubble("tobias", m.body); speak(m.body); }
        else bubble("guest", m.body);
      });
      if (waitingSince && Date.now() - waitingSince > 120000 && !lateShown) { lateShown = true; typing(false); note("tobLate"); }
    }, function () {});
  }
  function schedule() {
    clearTimeout(pollTimer);
    if (chat.hidden) return;
    pollTimer = setTimeout(function () { poll(); schedule(); }, waitingSince ? 2000 : 6000);
  }
  function openChat() {
    chat.hidden = false; document.body.style.overflow = "hidden";
    if (!msgs.children.length) { bubble("tobias", t("tobHi")); if (chatId) poll(); }
    schedule();
    if (matchMedia("(hover: hover)").matches) say.focus();
  }
  function closeChat() {
    chat.hidden = true; document.body.style.overflow = ""; clearTimeout(pollTimer);
    if (rec) try { rec.stop(); } catch (e) {}
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (location.hash === "#tobias") history.replaceState(null, "", location.pathname);
  }
  function send(text, voice) {
    text = (text || "").trim(); if (!text) return;
    if (!chatId) { chatId = newId(); try { localStorage.setItem("t-chat", chatId); } catch (e) {} }
    spoke = !!voice;
    var b = bubble("guest", text); say.value = ""; sendBtn.disabled = true; grow();
    rpc("web_chat_send", { p_chat: chatId, p_body: text.slice(0, 800), p_lang: lang, p_voice: !!voice }).then(function (r) {
      shownIds[r.id] = 1; waitingSince = Date.now(); lateShown = false; typing(true); schedule();
    }, function (e) {
      b.style.opacity = ".55"; note(e.code === "KB429" ? "tobMany" : "tobErr");
    });
  }
  function grow() { say.style.height = "auto"; say.style.height = Math.min(say.scrollHeight, 120) + "px"; sendBtn.disabled = !say.value.trim(); }
  say.addEventListener("input", grow);
  say.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(say.value, false); } });
  document.getElementById("compose").addEventListener("submit", function (e) { e.preventDefault(); send(say.value, false); });
  document.getElementById("open-chat").addEventListener("click", function () { history.replaceState(null, "", "#tobias"); openChat(); });
  document.getElementById("close-chat").addEventListener("click", closeChat);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !chat.hidden) closeChat(); });

  // Talking: the phone turns speech into text; when the customer talked, Tobias's answer is read aloud.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
  if (SR) {
    micBtn.hidden = false;
    micBtn.addEventListener("click", function () {
      if (rec) { rec.stop(); return; }
      if (window.speechSynthesis) speechSynthesis.cancel();
      rec = new SR(); rec.lang = lang === "en" ? "en-GB" : "de-DE"; rec.interimResults = true; rec.continuous = false;
      var heard = "";
      rec.onresult = function (ev) {
        heard = ""; for (var i = 0; i < ev.results.length; i++) heard += ev.results[i][0].transcript;
        say.value = heard; grow();
      };
      rec.onerror = function (ev) { if (ev.error === "not-allowed" || ev.error === "service-not-allowed") note("tobNoMic"); };
      rec.onend = function () { rec = null; micBtn.setAttribute("aria-pressed", "false"); if (heard.trim()) send(heard, true); };
      micBtn.setAttribute("aria-pressed", "true");
      try { rec.start(); } catch (e) { rec = null; micBtn.setAttribute("aria-pressed", "false"); }
    });
  }
  if (location.hash === "#tobias") setTimeout(openChat, 0);

  if (location.hash === "#live") setTimeout(function () { document.getElementById("open-map").click(); }, 0);

  // A soft light follows the finger or mouse on every button.
  document.querySelectorAll(".pill").forEach(function (p) {
    function at(e) { var r = p.getBoundingClientRect(); p.style.setProperty("--x", (e.clientX - r.left) + "px"); p.style.setProperty("--y", (e.clientY - r.top) + "px"); }
    p.addEventListener("pointermove", at);
    p.addEventListener("pointerdown", function (e) { at(e); p.classList.add("lit"); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { p.addEventListener(ev, function () { p.classList.remove("lit"); }); });
  });
  document.getElementById("job-link").href = "https://wa.me/4915777104912?text=" + encodeURIComponent(lang === "en" ? "Hello Transfer, I would like to work with Transfer in the future." : "Hallo Transfer, ich möchte in Zukunft bei Transfer mitarbeiten.");

  // The two app buttons. Android: the customer APK when it is published (../app/version.json), else how to install.
  // iPhone: an app outside the App Store cannot be installed, so the web app goes on the home screen.
  var how = document.getElementById("how"), apk = null;
  fetch("../app/version.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
    if (v && v.apk) { apk = "../app/" + v.apk; var a = document.getElementById("app-android"); a.href = apk; a.setAttribute("download", v.apk); }
  }, function () {});
  function openHow(kind) {
    var ios = kind === "ios";
    document.getElementById("how-title").textContent = ios ? t("howT") : "Transfer · Android";
    document.getElementById("how-p").textContent = ios ? t("howP") : t("howAP");
    document.getElementById("how-1").textContent = ios ? t("how1") : t("howA1");
    document.getElementById("how-2").textContent = ios ? t("how2") : t("howA2");
    document.getElementById("how-3").textContent = ios ? t("how3") : t("howA3");
    how.hidden = false; document.getElementById("how-ok").focus();
  }
  document.getElementById("app-ios").addEventListener("click", function () { openHow("ios"); });
  document.getElementById("app-android").addEventListener("click", function (e) { if (!apk) { e.preventDefault(); openHow("android"); } });
  document.getElementById("how-ok").addEventListener("click", function () { how.hidden = true; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !how.hidden) how.hidden = true; });

  applyLang();
})();
</script>
</body>
